<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ABVX Shortener</title>
    <style>
      :root {
        --bg: #0b0c10;
        --panel: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.64);
        --border: rgba(255, 255, 255, 0.16);
        --radius: 14px;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 360px;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", Arial, sans-serif;
        background:
          radial-gradient(500px 260px at 20% 20%, rgba(106, 255, 198, 0.14), transparent 60%),
          radial-gradient(420px 260px at 80% 30%, rgba(108, 141, 255, 0.14), transparent 60%),
          var(--bg);
        padding: 12px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: linear-gradient(180deg, var(--panel), rgba(255, 255, 255, 0.04));
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 14px 8px;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(106,255,198,0.95), rgba(108,141,255,0.95));
        display: grid;
        place-items: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      h1 { margin: 0; font-size: 14px; letter-spacing: 0.2px; }
      .sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

      .content { padding: 8px 14px 14px; }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 6px;
      }

      input[type="url"],
      input[type="password"],
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        outline: none;
      }

      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }

      button {
        width: 100%;
        appearance: none;
        border: 0;
        border-radius: 14px;
        padding: 11px 12px;
        font-weight: 600;
        color: #0b0c10;
        background: linear-gradient(135deg, rgba(106,255,198,1), rgba(108,141,255,1));
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        white-space: pre-wrap;
        display: none;
      }

      .actions { display: flex; gap: 6px; margin-top: 8px; }
      .actions button { width: auto; flex: 1; padding: 8px 10px; }

      .meta { color: var(--muted); font-size: 11px; margin-top: 8px; }
      .preview {
        margin-top: 8px;
        display: none;
        border: 1px dashed rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        padding: 10px;
      }

      .preview a { color: rgba(106,255,198,0.95); }

      .history {
        margin-top: 8px;
        border-top: 1px dashed rgba(255, 255, 255, 0.2);
        padding-top: 8px;
      }

      .history-item {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 10px;
        padding: 8px;
        margin-top: 6px;
      }

      .history-item:hover {
        border-color: rgba(255,255,255,0.3);
      }

      .history-item a {
        color: rgba(106,255,198,0.95);
      }

      .history-row {
        display: grid;
        gap: 6px;
      }

      .muted { color: var(--muted); font-size: 11px; }
      .history-actions {
        display: flex;
        gap: 6px;
      }
      .history-actions button { padding: 6px 10px; }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="head">
        <div class="logo" aria-hidden="true">AB</div>
        <div>
          <h1>ABVX Shortener</h1>
          <div class="sub">Shorten current tab and copy short URL</div>
        </div>
      </div>

      <div class="content">
        <form id="shortenForm">
          <label for="apiBaseUrl">Shortener endpoint</label>
          <input id="apiBaseUrl" type="url" placeholder="https://go.abvx.xyz" autocomplete="off" required />

          <label for="apiKey">API key</label>
          <input id="apiKey" type="password" placeholder="Enter API key" autocomplete="off" required />

          <label for="apiKeyId">API key ID (optional)</label>
          <input id="apiKeyId" type="text" placeholder="writer-1" autocomplete="off" />

          <label for="url">URL</label>
          <input id="url" type="url" placeholder="https://…" autocomplete="off" required />

          <label for="customSlug">Custom slug (optional)</label>
          <input id="customSlug" type="text" placeholder="my-link" autocomplete="off" />

          <div class="row" style="margin-top: 8px;">
            <label style="margin: 0; flex: 0 0 auto; width: 120px;">
              <input id="overwrite" type="checkbox" /> overwrite existing
            </label>
            <div>
              <label for="ttl" style="margin-top: 0;">TTL seconds (optional)</label>
              <input id="ttl" type="number" min="1" placeholder="86400" />
            </div>
          </div>

          <div class="actions" style="margin-top: 10px;">
            <button id="shortenBtn" type="submit">Shorten &amp; Copy</button>
            <button id="retryBtn" type="button">Retry</button>
          </div>
        </form>

        <div id="status" class="status"></div>

        <div id="previewWrap" class="preview">
          <a id="shortUrl" href="#" target="_blank" rel="noreferrer"></a>
          <div id="resultMeta" class="muted"></div>
          <div class="actions">
            <button id="copyBtn" type="button" disabled>Copy</button>
            <button id="openBtn" type="button" disabled>Open</button>
          </div>
        </div>

        <div class="history">
          <div class="muted" style="margin-bottom: 4px; display:flex; align-items:center; justify-content:space-between;">
            <span>Recent links</span>
            <button id="openLastBtn" type="button">Open last</button>
          </div>
          <div id="history"></div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
