name = "abvx-shortener"
main = "src/index.ts"
compatibility_date = "2026-09-11"
compatibility_flags = ["nodejs_compat"]

# Add your account_id if you want (optional; wrangler can infer after login)
# account_id = "..."

kv_namespaces = [
  { binding = "LINKS", id = "e35819886430430a992b4b73b0d6c6ea" }
]

[vars]
# Used for building shortUrl in API responses.
BASE_URL = "https://go.abvx.xyz"

# Rate limit (per IP and per API key) for POST /api/shorten.
RATE_LIMIT_WINDOW_SEC = 60
RATE_LIMIT_MAX = 30

# V0.3 security and governance controls.
ALLOW_NO_ORIGIN = "true"
ALLOWED_ORIGINS = ""
STRIP_TRAILING_SLASH = "true"
MAX_URL_LENGTH = 2048
DEFAULT_TTL_SECONDS = 0
TRUST_MODE = "personal"
ALLOW_URL_DOMAINS = ""
DENY_URL_DOMAINS = ""
URL_PRECHECK_URL = ""
URL_PRECHECK_TIMEOUT_MS = 1500
URL_PRECHECK_FAIL_OPEN = false
DEFAULT_REDIRECT_TYPE = "302"
STATS_RETENTION_DAYS = 30

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "31001"

  [ratelimits.simple]
  limit = 30
  period = 60

[observability]
enabled = true
head_sampling_rate = 1
