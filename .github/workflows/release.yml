name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install and verify
        working-directory: worker
        run: npm ci && npm run check
      - name: Build release assets
        run: |
          mkdir -p release
          zip -r "release/abvx-shortener-extension-${GITHUB_REF_NAME}.zip" extension
          cp bin/abvx-shorten "release/abvx-shorten-${GITHUB_REF_NAME}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "ABVX Shortener $GITHUB_REF_NAME"
