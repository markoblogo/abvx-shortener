version: 2
updates:
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      cloudflare-tooling:
        patterns:
          - "@cloudflare/*"
          - wrangler
          - vitest
      lint-and-format:
        patterns:
          - eslint
          - "@typescript-eslint/*"
          - prettier
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
