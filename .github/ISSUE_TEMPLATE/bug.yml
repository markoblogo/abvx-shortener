name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, Cloudflare tokens or private links.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.3.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Worker, Wrangler, browser and extension versions where relevant.
